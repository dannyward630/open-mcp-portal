# Development dependencies only. Ports bind to loopback; never expose these.
# `make deps-up` starts Postgres; it restarts with Docker (restart:
# unless-stopped) until `make deps-down`.
name: open-mcp-gateway
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: omg
      POSTGRES_PASSWORD: omg-dev-only
      POSTGRES_DB: omg
    ports: ["127.0.0.1:55442:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omg -d omg"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres: {}
