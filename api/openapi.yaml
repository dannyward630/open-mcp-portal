          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
    delete:
      tags:
      - service-accounts
      operationId: deleteServiceAccount
      summary: Delete a service account and revoke its keys (team owners and admins); its call records are kept
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/service-accounts/{serviceAccountId}/keys:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    - $ref: '#/components/parameters/ServiceAccountIdParam'
    get:
      tags:
      - service-accounts
      operationId: listServiceAccountKeys
      summary: A service account's keys, including revoked and expired ones from the last 30 days (team owners and
        admins; platform staff)
      responses:
        '200':
          description: Keys, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceAccountKey'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - service-accounts
      operationId: createServiceAccountKey
      summary: Create a key (team owners and admins, browser session only); the secret is shown once
      description: 409 too_many_keys (at most 2 active keys, for rotation). 422 gateway_not_usable (details.gatewayIds)
        when a scoped gateway isn't one the service account can use. 409 disabled for a turned-off account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountKeyCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceAccountKeyCreated'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '422':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/service-accounts/{serviceAccountId}/keys/{keyId}:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    - $ref: '#/components/parameters/ServiceAccountIdParam'
    - name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      tags:
      - service-accounts
      operationId: revokeServiceAccountKey
      summary: Revoke a key (team owners and admins); takes effect on the next request
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
components:
  headers:
    ETag:
      description: Quoted revision, for If-Match on the next update
      schema:
        type: string
  parameters:
    AuditActionParam:
      name: action
      in: query
      required: false
      description: An exact action (team.member_add), or a prefix ending in a dot (team.) for every action in that
        group.
      schema:
        type: string
        maxLength: 100
        pattern: ^[a-z][a-z_]*\.[a-z_]*$
        example: team.
    AuditActorKindParam:
      name: actorKind
      in: query
      required: false
      description: Only entries by the system
      schema:
        type: string
        enum:
        - system
    AuditActorParam:
      name: actorUserId
      in: query
      required: false
      description: Only entries by this person (including their API keys)
      schema:
        type: string
        format: uuid
    AuditExcludeActionParam:
      name: excludeAction
      in: query
      required: false
      description: 'Action groups (prefixes ending in a dot, comma-separated) to leave out: auth. hides sign-ins
        and sign-outs.'
      schema:
        type: string
        maxLength: 100
        pattern: ^[a-z][a-z_]*\.(,[a-z][a-z_]*\.)*$
        example: auth.
    AuditFromParam:
      name: from
      in: query
      required: false
      description: Entries at or after this time
      schema:
        type: string
        format: date-time
    AuditTargetTypeParam:
      name: targetType
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-z_]+$
        example: team
    AuditToParam:
      name: to
      in: query
      required: false
      description: Entries before this time (exclusive)
      schema:
        type: string
        format: date-time
    CursorParam:
      name: cursor
      in: query
      required: false
      description: nextCursor from the previous page
      schema:
        type: string
    IfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: The resource's revision, as returned in ETag (for example "3"). Missing returns 428; stale returns
        412.
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    SearchParam:
      name: q
      in: query
      required: false
      description: Case-insensitive substring match
      schema:
        type: string
        maxLength: 200
    TeamParam:
      name: team
      in: path
      required: true
      description: Team slug or ID
      schema:
        type: string
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServerIdParam:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CapabilityIdParam:
      name: capabilityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CapabilityKindParam:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CapabilityKind'
    GatewayOptionKindParam:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/GatewayCapabilityKind'
    GatewayOptionServerParam:
      name: server
      in: query
      required: false
      description: Only this MCP server's capabilities (server ID)
      schema:
        type: string
        format: uuid
    GatewayOptionLimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    GatewayIdParam:
      name: gatewayId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CallGatewayParam:
      name: gateway
      in: query
      required: false
      description: Gateway ID
      schema:
        type: string
        format: uuid
    CallServerParam:
      name: server
      in: query
      required: false
      description: MCP server ID
      schema:
        type: string
        format: uuid
    CallOutcomeParam:
      name: outcome
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/McpCallOutcome'
    CallUserParam:
      name: user
      in: query
      required: false
      description: Only calls made by this person (any credential)
      schema:
        type: string
        format: uuid
    OAuthGrantIdParam:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceAccountIdParam:
      name: serviceAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CallServiceAccountParam:
      name: serviceAccount
      in: query
      required: false
      description: Only calls made by this service account
      schema:
        type: string
        format: uuid
  responses:
    AuditPageReply:
      description: A page of audit entries, newest first
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/AuditPage'
    ErrorReply:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HealthReply:
      description: Health status
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Health'
    OkReply:
      description: Success
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Ok'
    GatewayOptionPageReply:
      description: A page of options ordered by server name, then name
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/GatewayOptionPage'
    McpCallPageReply:
      description: A page of calls, newest first
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/McpCallPage'
  schemas:
    AuditActor:
      type: object
      description: Who made the change, resolved when the log is read
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - user
          - api_key
          - system
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        apiKeyName:
          type: string
          description: The API key used (api_key actors)
    AuditEntry:
      type: object
      required:
      - id
      - occurredAt
      - actorKind
      - actor
      - action
      - targetType
      - targetId
      - targetLabel
      - targetExists
      - metadata
      - requestId
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        actorKind:
          type: string
          enum:
          - user
          - api_key
          - system
        actorUserId:
          type: string
          format: uuid
          nullable: true
        teamId:
          type: string
          format: uuid
          nullable: true
        teamName:
          type: string
          nullable: true
          description: The team's name for a team's entry (null for platform entries, or when the team was deleted)
        teamSlug:
          type: string
          nullable: true
          description: The team's slug, with teamName
        action:
          type: string
          example: team.member_add
        actor:
          $ref: '#/components/schemas/AuditActor'
        targetType:
          type: string
        targetId:
          type: string
        targetLabel:
          type: string
          nullable: true
          description: The target's current name, resolved when the log is read. For a deleted target, the last
            name recorded in the audit log; null when none is known.
        targetExists:
          type: boolean
          description: Whether the target still exists (deleted and soft-deleted targets are false)
        before:
          description: Configuration before the change
          nullable: true
        after:
          description: Configuration after the change
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        requestId:
          type: string
        via:
          allOf:
          - $ref: '#/components/schemas/AuditVia'
          nullable: true
          description: How the person acted. Null for the systems entries.
        clientIp:
          type: string
          nullable: true
          description: The caller's address as recorded, in the platform log only (null in a team's log, or when
            none was recorded).
    AuditPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        nextCursor:
          type: string
          nullable: true
    AuditVia:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - session
          - api_key
          - oauth
          description: 'session: signed in to the web app; api_key: with an API key; oauth: through a connected
            MCP client.'
        name:
          type: string
          description: The API key's or the connected app's name, when known
    AuthConfig:
      type: object
      required:
      - oidcEnabled
      - devAuthEnabled
      - loginUrl
      - devAccounts
      - instance
      properties:
        instance:
          $ref: '#/components/schemas/InstanceInfo'
        oidcEnabled:
          type: boolean
        devAuthEnabled:
          type: boolean
        loginUrl:
          type: string
        devAccounts:
          type: array
          items:
            $ref: '#/components/schemas/DevAccount'
        teamRequestUrl:
          type: string
          nullable: true
          description: Where people request a new team (only platform admins create teams)
    Capabilities:
      type: object
      required:
      - platformAdmin
      - platformAuditor
      properties:
        platformAdmin:
          type: boolean
        platformAuditor:
          type: boolean
    DevAccount:
      type: object
      required:
      - id
      - name
      - email
      - platformRole
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        platformRole:
          $ref: '#/components/schemas/PlatformRole'
    DevLoginRequest:
      type: object
      required:
      - account
      properties:
        account:
          type: string
          example: admin
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: Structured context for some errors.
    Health:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - ok
          - draining
          - unavailable
        checks:
          type: object
          additionalProperties:
            type: string
    InstanceInfo:
      type: object
      description: How this deployment presents itself (INSTANCE_NAME, ORG_NAME, UI_THEME, UI_LOGO_URL, SUPPORT_URL).
      required:
      - name
      - orgName
      - theme
      - logoUrl
      - supportUrl
      properties:
        name:
          type: string
          example: Open MCP Gateway
          description: Product name shown in the UI and page titles
        orgName:
          type: string
          example: Example Corp
          description: Organisation name (empty when not configured)
        theme:
          type: string
          enum:
          - neutral
          description: UI theme, applied as data-brand on the html element
        logoUrl:
          type: string
          nullable: true
          example: https://www.example.edu/logo.svg
          description: https URL or same-origin path of the logo
        supportUrl:
          type: string
          nullable: true
          example: https://help.example.edu/ai
          description: 'Where the Help link points: an http(s) URL or a mailto: address'
    Invite:
      type: object
      required:
      - id
      - email
      - role
      - createdAt
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: '#/components/schemas/TeamRole'
        invitedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Me:
      type: object
      required:
      - user
      - csrfToken
      - capabilities
      - teams
      - groups
      properties:
        teams:
          type: array
          items:
            $ref: '#/components/schemas/MyTeam'
        groups:
          type: array
          description: The caller's IdP groups as of their last sign-in (from OIDC_GROUPS_CLAIM; may be empty).
            Platform gateways can be granted to them.
          items:
            type: string
        user:
          $ref: '#/components/schemas/User'
        csrfToken:
          type: string
        capabilities:
          $ref: '#/components/schemas/Capabilities'
    Member:
      type: object
      required:
      - user
      - role
      - revision
      - createdAt
      properties:
        user:
          $ref: '#/components/schemas/MemberUser'
        role:
          $ref: '#/components/schemas/TeamRole'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          type: string
          format: date-time
    MemberAdd:
      type: object
      required:
      - email
      - role
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/TeamRole'
    MemberAddResult:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - added
          - invited
        member:
          $ref: '#/components/schemas/Member'
        invite:
          $ref: '#/components/schemas/Invite'
    MemberUpdate:
      type: object
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/TeamRole'
    MemberUser:
      type: object
      required:
      - id
      - email
      - displayName
      - status
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
    MyTeam:
      type: object
      required:
      - id
      - slug
      - name
      - status
      - role
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/TeamStatus'
        role:
          $ref: '#/components/schemas/TeamRole'
    Ok:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    OwnerAssign:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    PlatformRole:
      type: string
      enum:
      - none
      - platform_admin
      - platform_auditor
    Revision:
      type: integer
      format: int64
      description: Increases on every change. Send it back in If-Match.
    Team:
      type: object
      required:
      - id
      - slug
      - name
      - description
      - status
      - revision
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TeamStatus'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
    TeamCreate:
      type: object
      required:
      - slug
      - name
      - ownerEmail
      properties:
        slug:
          type: string
          example: platform-tools
        name:
          type: string
          example: Platform Tools
        description:
          type: string
        ownerEmail:
          type: string
          format: email
    TeamCreated:
      type: object
      required:
      - team
      - owner
      properties:
        team:
          $ref: '#/components/schemas/TeamSummary'
        owner:
          $ref: '#/components/schemas/MemberAddResult'
    TeamPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamSummary'
        nextCursor:
          type: string
          nullable: true
    TeamRole:
      type: string
      enum:
      - owner
      - admin
      - editor
      - member
    TeamStatus:
      type: string
      enum:
      - active
      - archived
    TeamSummary:
      type: object
      required:
      - team
      - memberCount
      - ownerCount
      - ownerInvites
      properties:
        team:
          $ref: '#/components/schemas/Team'
        memberCount:
          type: integer
          format: int64
        ownerCount:
          type: integer
          format: int64
        ownerInvites:
          type: integer
          format: int64
          description: Open owner invites (an owner invited by email who hasn't signed in yet)
    TeamUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TeamStatus'
    TeamView:
      type: object
      required:
      - team
      properties:
        team:
          $ref: '#/components/schemas/Team'
        role:
          description: The caller's role; absent when viewing as a platform admin or auditor
          allOf:
          - $ref: '#/components/schemas/TeamRole'
    User:
      type: object
      required:
      - id
      - email
      - displayName
      - platformRole
      - status
      - revision
      - createdAt
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        platformRole:
          $ref: '#/components/schemas/PlatformRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        teamCount:
          type: integer
          format: int64
          description: Teams the user belongs to (admin user list only)
    UserDetail:
      type: object
      required:
      - user
      - teams
      properties:
        user:
          $ref: '#/components/schemas/User'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/MyTeam'
    UserPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type: string
          nullable: true
    UserStatus:
      type: string
      enum:
      - active
      - suspended
    UserUpdate:
      type: object
      properties:
        platformRole:
          $ref: '#/components/schemas/PlatformRole'
        status:
          $ref: '#/components/schemas/UserStatus'
    PublishPolicy:
      type: string
      enum:
      - approval_required
      - self_publish
      description: 'approval_required: a platform admin approves each server, and each changed capability, before
        it reaches the catalog. self_publish: the team''s owners and admins do.'
    PublishState:
      type: string
      enum:
      - private
      - pending
      - published
      - rejected
    CapabilityKind:
      type: string
      enum:
      - tool
      - resource
      - resource_template
      - prompt
    McpErrorClass:
      type: string
      enum:
      - unavailable
      - auth
      - not_found
      - rate_limited
      - bad_request
      - bad_response
      - config
      - timeout
      - too_large
      - not_allowed
      description: 'not_allowed: the URL or an address it resolves to is refused (blocked, or internal and not allowlisted),
        or the server redirected'
    CapabilityCounts:
      type: object
      required:
      - tools
      - resources
      - resourceTemplates
      - prompts
      properties:
        tools:
          type: integer
          format: int64
        resources:
          type: integer
          format: int64
        resourceTemplates:
          type: integer
          format: int64
        prompts:
          type: integer
          format: int64
    ServerHealth:
      type: object
      description: The latest health check. unknown before the first one.
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - healthy
          - failing
          - unknown
        checkedAt:
          type: string
          format: date-time
        statusSince:
          type: string
          format: date-time
          description: When the current status began
        latencyMs:
          type: integer
          format: int32
        errorClass:
          $ref: '#/components/schemas/McpErrorClass'
        message:
          type: string
    McpServer:
      type: object
      description: A remote MCP server a team registered. The auth header value is never returned.
      required:
      - id
      - teamId
      - teamSlug
      - teamName
      - slug
      - name
      - description
      - url
      - transport
      - hasAuth
      - authValueHint
      - timeoutSeconds
      - enabled
      - publishState
      - effectivePublishPolicy
      - counts
      - pendingChanges
      - health
      - revision
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        teamSlug:
          type: string
        teamName:
          type: string
        slug:
          type: string
