      tags:
      - admin
      operationId: adminUpdateNetworkSettings
      summary: Replace the platform admins' allowlist entries (platform admins)
      description: Entries are canonicalised (masked prefixes, lower-case host names without a trailing dot). 422
        invalid_entry with details.index and details.reason (invalid_kind, invalid_cidr, invalid_host, non_ascii,
        ip_as_host, always_blocked, invalid_note, duplicate, too_many). Servers are never edited; one outside the
        new policy fails its next exchange (error class not_allowed). Other replicas apply the change within 30
        seconds. Audited as settings.network_update.
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
