          $ref: '#/components/schemas/ApiKey'
        secret:
          type: string
          description: The full key, shown only now. Send it as Authorization Bearer to /mcp/{slug}.
    McpCallOutcome:
      type: string
      enum:
      - ok
      - tool_error
      - denied
      - upstream_error
      - timeout
      - too_large
      - bad_request
      description: 'ok: answered. tool_error: the tool reported an error. denied: refused by policy (logged, the
        client saw not found). upstream_error: unreachable, refused or malformed. bad_request: the client''s request
        was invalid.'
    McpCall:
      type: object
      required:
      - id
      - occurredAt
      - method
      - outcome
      - latencyMs
      - requestBytes
      - responseBytes
      - requestId
      - gateway
      - principal
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        method:
          type: string
          description: tools/list, tools/call, prompts/list, prompts/get, resources/list, resources/templates/list
            or resources/read
          example: tools/call
        exposedName:
          type: string
          description: The tool or prompt name, or the exposed resource URI, the client used (absent for list calls)
        gateway:
          $ref: '#/components/schemas/CallRef'
        server:
          $ref: '#/components/schemas/CallRef'
        principal:
          $ref: '#/components/schemas/CallPrincipal'
        clientName:
          type: string
          description: clientInfo.name from initialize, when sent
        outcome:
          $ref: '#/components/schemas/McpCallOutcome'
        errorClass:
          type: string
          description: Why a call was denied or failed, for example no_access, role, unknown, key_scope (the API
            key is limited to other gateways), gateway_disabled or an unavailability reason
        latencyMs:
          type: integer
          format: int32
        requestBytes:
          type: integer
          format: int64
        responseBytes:
          type: integer
          format: int64
        requestId:
          type: string
    CallRef:
      type: object
      required:
      - id
      - slug
      - name
      - exists
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        exists:
          type: boolean
    CallPrincipal:
      type: object
      required:
      - kind
      - displayName
      properties:
        kind:
          type: string
          enum:
          - api_key
          - oauth
          - service_account
          description: 'api_key: a personal key; oauth: a connected MCP client acting for a person; service_account:
            a team service account key'
        userId:
          type: string
          format: uuid
          description: The person (api_key and oauth)
        displayName:
          type: string
          description: The person's name, or the service account's name
        email:
          type: string
          description: The person (api_key and oauth)
        apiKeyName:
          type: string
          description: The key used (api_key and service_account)
        oauthClientName:
          type: string
          description: The connected client (oauth)
        serviceAccountId:
          type: string
          format: uuid
        serviceAccountTeamSlug:
          type: string
    McpCallPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/McpCall'
        nextCursor:
          type: string
          nullable: true
    OAuthClientInfo:
      type: object
      required:
      - id
      - kind
      - name
      - host
      - uri
      - logoUrl
      - trusted
      properties:
        id:
          type: string
          description: 'The client_id: an https URL (a Client ID Metadata Document) or a registered client''s id'
        kind:
          type: string
          enum:
          - metadata
          - registered
          description: 'metadata: its host vouches for it; registered: it registered itself, so its name is unverified'
        name:
          type: string
        host:
          type: string
          description: The host that vouches for the client, or a registered client's own home page host (may be
            empty)
        uri:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        trusted:
          type: boolean
          description: On the trusted-client list (skips the consent screen)
    OAuthConsent:
      type: object
      required:
      - client
      - gateway
      - redirectUri
      - redirectHost
      - remembered
      properties:
        client:
          $ref: '#/components/schemas/OAuthClientInfo'
        gateway:
          $ref: '#/components/schemas/MyGateway'
        redirectUri:
          type: string
        redirectHost:
          type: string
          description: Where the browser goes back to, such as 127.0.0.1:53211
        remembered:
          type: boolean
          description: The caller already allowed this client for this gateway
    OAuthConsentDecision:
      type: object
      required:
      - query
      - decision
      properties:
        query:
          type: string
          maxLength: 8000
          description: The authorization request's query string, as the consent page received it
        decision:
          type: string
          enum:
          - allow
          - deny
    OAuthGrant:
      type: object
      required:
      - id
      - client
      - gateway
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        client:
          $ref: '#/components/schemas/OAuthClientInfo'
        gateway:
          $ref: '#/components/schemas/CallRef'
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
    TrustedClient:
      type: object
      required:
      - clientId
      properties:
        clientId:
          type: string
          maxLength: 500
          example: https://claude.ai/oauth/claude-code-client-metadata
        label:
          type: string
          maxLength: 100
          example: Claude Code
    TrustedClients:
      type: object
      required:
      - clients
      - revision
      - updatedAt
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/TrustedClient'
        revision:
          $ref: '#/components/schemas/Revision'
        updatedAt:
          type: string
          format: date-time
    TrustedClientsUpdate:
      type: object
      required:
      - clients
      properties:
        clients:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TrustedClient'
    ServiceAccountRole:
      type: string
      enum:
      - member
      - editor
      description: The team role used for capabilities' minimum roles (decision 22)
    ServiceAccount:
      type: object
      required:
      - id
      - teamId
      - teamSlug
      - name
      - description
      - role
      - enabled
      - activeKeyCount
      - revision
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        teamSlug:
          type: string
        name:
          type: string
          example: ci-release-bot
        description:
          type: string
        role:
          $ref: '#/components/schemas/ServiceAccountRole'
        enabled:
          type: boolean
        activeKeyCount:
          type: integer
          format: int64
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdByName:
          type: string
          nullable: true
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ServiceAccountCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
          description: Lower-case letters, digits and dashes; unique within the team
        description:
          type: string
          maxLength: 2000
        role:
          allOf:
          - $ref: '#/components/schemas/ServiceAccountRole'
          default: member
        enabled:
          type: boolean
          default: true
    ServiceAccountUpdate:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
        description:
          type: string
          maxLength: 2000
        role:
          $ref: '#/components/schemas/ServiceAccountRole'
        enabled:
          type: boolean
    ServiceAccountKey:
      type: object
      required:
      - id
      - name
      - prefix
      - status
      - createdAt
      - expiresAt
      - gateways
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The first characters of the key (omcp_sa_xxxxxxxx)
        status:
          type: string
          enum:
          - active
          - expired
          - revoked
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        gateways:
          type: array
          description: The gateways the key is limited to (empty = every gateway the account can use)
          items:
            $ref: '#/components/schemas/ApiKeyGateway'
    ServiceAccountKeyCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        expiresInDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          default: 90
        gatewayIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    ServiceAccountKeyCreated:
      type: object
      required:
      - key
      - secret
      properties:
        key:
          $ref: '#/components/schemas/ServiceAccountKey'
        secret:
          type: string
          description: The full key, shown only now
