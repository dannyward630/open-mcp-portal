      tags:
      - oauth
      operationId: decideOAuthConsent
      summary: Allow or deny an authorization request; returns where to send the browser
      description: Allow records the caller's consent for the client and gateway (audited as oauth.consent) and
        issues a single-use authorization code valid for 60 seconds. Deny sends the client access_denied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthConsentDecision'
      responses:
        '200':
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - redirectUrl
                    properties:
                      redirectUrl:
                        type: string
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
