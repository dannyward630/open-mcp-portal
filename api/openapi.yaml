      summary: 'The consent page''s view of an authorization request: the client, the gateway and where the browser
        goes back to'
      description: Takes the authorization request's parameters as they are and checks them again (signed-in session
        required). 400 with the reason for a request that isn't valid (the page shows it and never redirects). 404
        when the resource names no gateway the caller can use.
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
      - name: response_type
        in: query
        required: true
        schema:
          type: string
      - name: code_challenge
        in: query
        required: true
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: true
        schema:
          type: string
      - name: resource
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The request is valid
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OAuthConsent'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
