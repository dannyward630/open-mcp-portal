openapi: 3.0.3
info:
  title: Open MCP Gateway API
  version: 0.1.0
  description: 'Management API. Browser sessions authenticate with a cookie; writes need the session''s `X-CSRF-Token`
    (from `GET /v1/me`) and a same-origin `Origin`. Success responses are `{"data": ...}` and errors `{"error":
    {"code": "...", "message": "..."}}`.


    Every route served by the application must be listed here; a test enforces it. MCP endpoints (`/mcp/{slug}`),
    OAuth protocol endpoints and `/.well-known/*` are documented in docs/.

    '
tags:
- name: operations
- name: auth
- name: me
- name: teams
- name: admin
- name: mcp-servers
  description: Team-owned MCP servers, discovery, health and publishing to the company catalog
- name: catalog
  description: Published MCP servers any signed-in person can browse
- name: gateways
  description: Curated sets of MCP capabilities served at /mcp/{slug}, their access and their call records
- name: api-keys
  description: Personal API keys for MCP clients and scripts
- name: oauth
  description: OAuth sign-in for MCP clients (docs/phase4-client-auth.md) — the consent page, connected apps and
    trusted clients. The protocol endpoints (/oauth/*, /.well-known/oauth-*) are outside this contract, like /mcp.
- name: service-accounts
  description: Team-owned identities for headless agents, CI and scripts
paths:
  /healthz:
    get:
      tags:
      - operations
      operationId: getHealthz
      summary: Liveness probe
      responses:
        '200':
          $ref: '#/components/responses/HealthReply'
  /readyz:
    get:
      tags:
      - operations
      operationId: getReadyz
      summary: Readiness probe (dependencies reachable and not draining)
      responses:
        '200':
          $ref: '#/components/responses/HealthReply'
        '503':
          $ref: '#/components/responses/HealthReply'
  /auth/login:
    get:
      tags:
      - auth
      operationId: startLogin
      summary: Start single sign-on (redirects to the identity provider)
      parameters:
      - name: next
        in: query
        required: false
        description: Same-origin path to return to after sign-in.
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the identity provider
        '404':
          $ref: '#/components/responses/ErrorReply'
        '429':
          $ref: '#/components/responses/ErrorReply'
        '503':
          $ref: '#/components/responses/ErrorReply'
  /auth/callback:
    get:
      tags:
      - auth
      operationId: completeLogin
      summary: OIDC redirect target
      responses:
        '303':
          description: Signed in; redirect into the app
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
  /auth/dev:
    post:
      tags:
      - auth
      operationId: devLogin
      summary: Development sign-in (only when DEV_AUTH=true on a loopback APP_URL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      summary: End the current browser session
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
  /v1/auth/config:
    get:
      tags:
      - auth
      operationId: getAuthConfig
      summary: Sign-in methods and instance identity for the web UI
      responses:
        '200':
          description: Sign-in configuration
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthConfig'
  /v1/me:
    get:
      tags:
      - me
      operationId: getMe
      summary: The signed-in user, CSRF token and capabilities
      parameters:
      - name: optional
        in: query
        required: false
        description: With true, a request without a session cookie gets data null (200) instead of a 401, for pages
          that work signed out. An expired session is still a 401 (and clears the cookie).
        schema:
          type: boolean
      responses:
        '200':
          description: Current user (null only with optional=true and no session cookie)
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    nullable: true
                    allOf:
                    - $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams:
    get:
      tags:
      - teams
      operationId: listMyTeams
      summary: Teams the caller belongs to
      responses:
        '200':
          description: Memberships
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyTeam'
        '401':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - teams
      operationId: getTeam
      summary: A team the caller belongs to (platform admins and auditors see any team)
      responses:
        '200':
          description: Team
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TeamView'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/members:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - teams
      operationId: listMembers
      summary: Team members
      responses:
        '200':
          description: Members, owners first
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '404':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - teams
      operationId: addMember
      summary: Add a member by email, or invite them if they have never signed in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAdd'
      responses:
        '201':
          description: Added or invited
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MemberAddResult'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/members/{userId}:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    - $ref: '#/components/parameters/UserIdParam'
    patch:
      tags:
      - teams
      operationId: updateMember
      summary: Change a member's role
      description: 409 last_owner for the team's only owner.
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
      responses:
        '200':
          description: Updated member
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
    delete:
      tags:
      - teams
      operationId: removeMember
      summary: Remove a member, or leave the team (your own user ID)
      description: 409 last_owner for the team's only owner.
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/invites:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - teams
      operationId: listInvites
      summary: Open email invites
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invite'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/invites/{inviteId}:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    - name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      tags:
      - teams
      operationId: revokeInvite
      summary: Revoke an open invite
      description: Team owners and admins (within their role's reach), and platform admins for any open invite,
        such as an owner invite sent from Admin -> Teams.
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/audit:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - teams
      operationId: listTeamAudit
      summary: The team's audit log (owners, admins and editors)
      parameters:
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/AuditActionParam'
      - $ref: '#/components/parameters/AuditExcludeActionParam'
      - $ref: '#/components/parameters/AuditActorParam'
      - $ref: '#/components/parameters/AuditActorKindParam'
      - $ref: '#/components/parameters/AuditTargetTypeParam'
      - $ref: '#/components/parameters/AuditFromParam'
      - $ref: '#/components/parameters/AuditToParam'
      responses:
        '200':
          $ref: '#/components/responses/AuditPageReply'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/audit/{entryId}:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    - name: entryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - teams
      operationId: getTeamAuditEntry
      summary: One entry of the team's audit log, for a linked entry (owners, admins and editors)
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuditEntry'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/users:
    get:
      tags:
      - admin
      operationId: adminListUsers
      summary: All users (platform admins and auditors), with how many teams each belongs to
      parameters:
      - $ref: '#/components/parameters/SearchParam'
      - name: role
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PlatformRole'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UserStatus'
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A page of users ordered by email
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserPage'
        '403':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/users/{userId}:
    parameters:
    - $ref: '#/components/parameters/UserIdParam'
    get:
      tags:
      - admin
      operationId: adminGetUser
      summary: A user and their team memberships
      responses:
        '200':
          description: User
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserDetail'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
    patch:
      tags:
      - admin
      operationId: adminUpdateUser
      summary: Change a user's platform role or suspend/reactivate them
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated user
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/teams:
    get:
      tags:
      - admin
      operationId: adminListTeams
      summary: All teams (platform admins and auditors)
      parameters:
      - $ref: '#/components/parameters/SearchParam'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TeamStatus'
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A page of teams ordered by slug
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TeamPage'
        '403':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - admin
      operationId: adminCreateTeam
      summary: Create a team and assign its first owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TeamCreated'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/teams/{team}:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - admin
      operationId: adminGetTeam
      summary: A team with membership counts
      responses:
        '200':
          description: Team
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TeamSummary'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
    patch:
      tags:
      - admin
      operationId: adminUpdateTeam
      summary: Change team details, or archive/unarchive it
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdate'
      responses:
        '200':
          description: Updated team
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TeamSummary'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/teams/{team}/owners:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    post:
      tags:
      - admin
      operationId: adminAssignOwner
      summary: Make someone an owner of a team (promotes, adds or invites)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerAssign'
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MemberAddResult'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/audit:
    get:
      tags:
      - admin
      operationId: adminListAudit
      summary: The platform-wide audit log (platform admins and auditors)
      parameters:
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/AuditActionParam'
      - $ref: '#/components/parameters/AuditExcludeActionParam'
      - $ref: '#/components/parameters/AuditActorParam'
      - $ref: '#/components/parameters/AuditActorKindParam'
      - $ref: '#/components/parameters/AuditTargetTypeParam'
      - $ref: '#/components/parameters/AuditFromParam'
      - $ref: '#/components/parameters/AuditToParam'
      responses:
        '200':
          $ref: '#/components/responses/AuditPageReply'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/audit/{entryId}:
    parameters:
    - name: entryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - admin
      operationId: adminGetAuditEntry
      summary: One entry of the platform-wide audit log, for a linked entry (platform admins and auditors)
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuditEntry'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/mcp-servers:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - mcp-servers
      operationId: listTeamMcpServers
      summary: The team's MCP servers (members and above; platform staff read any team)
      parameters:
      - $ref: '#/components/parameters/SearchParam'
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A page of servers ordered by name
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/McpServerPage'
        '404':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - mcp-servers
      operationId: createTeamMcpServer
      summary: Register a remote MCP server (editors and above); reads its capabilities at once
      description: 409 slug_taken when another server uses the slug. 422 url_not_allowed when the URL is refused
        (details.reason invalid, too_long, userinfo, query, fragment, scheme, private_address or blocked_address;
        private_address can be allowed by a platform admin in Internal networks). The server is created even when
        discovery fails; refresh then says why.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpServerCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/McpServerCreated'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '422':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/mcp-servers/{serverId}:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    - $ref: '#/components/parameters/ServerIdParam'
    get:
      tags:
      - mcp-servers
      operationId: getTeamMcpServer
      summary: One of the team's servers
      responses:
        '200':
          description: Server
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/McpServer'
        '404':
          $ref: '#/components/responses/ErrorReply'
    patch:
      tags:
      - mcp-servers
      operationId: updateTeamMcpServer
      summary: Change a server's settings (editors and above); the slug never changes
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpServerUpdate'
      responses:
        '200':
          description: Updated server
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/McpServer'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '422':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
    delete:
      tags:
      - mcp-servers
      operationId: deleteTeamMcpServer
      summary: Delete a server and its capabilities (team owners and admins)
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/mcp-servers/{serverId}/test:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    - $ref: '#/components/parameters/ServerIdParam'
    post:
      tags:
      - mcp-servers
      operationId: testTeamMcpServer
      summary: Connect and list capabilities without saving them (editors and above); stored as a health check
      responses:
        '200':
          description: The test result (ok false is still 200)
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
