# NetworkPolicies for the portal pods only (podSelector on the
# open-mcp-portal labels), so the base can share a namespace. Once any
# policy selects a pod, everything not allowed by some policy is denied;
# open-mcp-portal-default-deny makes that explicit.
#
# Overlays commonly patch:
#   open-mcp-portal-ingress         the ingress controller's namespace
#                                    (placeholder: ingress-controller)
#   open-mcp-portal-egress-postgres narrow TCP 5432 to where Postgres runs
#   open-mcp-portal-egress-dns      if cluster DNS is not kube-dns in
#                                    kube-system
# and add egress for MCP servers or an OIDC provider on ports other than
# 443 (open-mcp-portal-egress-https allows TCP 443 only).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-mcp-portal-default-deny
  labels:
    app.kubernetes.io/name: open-mcp-portal
    app.kubernetes.io/part-of: open-mcp-portal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-mcp-portal
  policyTypes: [Ingress, Egress]
---
# Traffic from the ingress controller (or Gateway API implementation) to the
# app port. Patch the namespace to the controller's (for example
# ingress-nginx, traefik). Kubelet probes are not affected by this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-mcp-portal-ingress
  labels:
    app.kubernetes.io/name: open-mcp-portal
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: open-mcp-portal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-mcp-portal
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-controller
      ports:
        - protocol: TCP
          port: 8088
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-mcp-portal-egress-dns
  labels:
    app.kubernetes.io/name: open-mcp-portal
    app.kubernetes.io/part-of: open-mcp-portal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-mcp-portal
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# PostgreSQL on TCP 5432, in the cluster (any namespace) or outside it (a
# managed database). Narrow it in the overlay: the Postgres namespace and
# pod labels, or the database's address as an ipBlock.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-mcp-portal-egress-postgres
  labels:
    app.kubernetes.io/name: open-mcp-portal
    app.kubernetes.io/part-of: open-mcp-portal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-mcp-portal
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 5432
---
# HTTPS to anywhere: upstream MCP servers and the OIDC provider. The
# portal's own SSRF guard still applies whatever this allows: outside
# development it connects to public addresses, and to internal ones only
# when the allowlist (UPSTREAM_ALLOWED_NETWORKS or Admin › Internal
# networks) covers them, never to loopback or link-local ones, and it never
# uses an HTTP(S) proxy. MCP servers registered on another port (for
# example https://mcp.example.com:8443, or plain http on 80/8080) need an
# extra egress rule for that port in the overlay; in-cluster servers
# (*.svc.cluster.local) usually need a namespaceSelector/podSelector rule,
# since many CNIs don't apply ipBlock to pod addresses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-mcp-portal-egress-https
  labels:
    app.kubernetes.io/name: open-mcp-portal
    app.kubernetes.io/part-of: open-mcp-portal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-mcp-portal
      app.kubernetes.io/component: server
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 443
