# The smoke test's namespace (scripts/k8s-smoke.sh). Same Pod Security
# Standard as the example overlay: the portal, the throwaway PostgreSQL and
# the fake MCP server all have to meet `restricted`.
apiVersion: v1
kind: Namespace
metadata:
  name: omp-smoke
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
