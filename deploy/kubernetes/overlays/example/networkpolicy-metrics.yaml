# Prometheus (in the namespace "monitoring"; patch to yours) scrapes
# /metrics on the metrics port. The endpoint has no authentication: no one
# else may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-mcp-portal-metrics
  labels:
    app.kubernetes.io/name: open-mcp-portal
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: open-mcp-portal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-mcp-portal
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
